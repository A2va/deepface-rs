[package]
name = "deepface"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "3"
members = [
    "calibration",
]

[workspace.dependencies]
# burn = {version = "0.21", features = ["vision"]}
burn = {git = "https://github.com/tracel-ai/burn", features = ["vision"] }

[dependencies]
image = "0.25"
burn = { workspace = true }
# burn-store = "0.21"
burn-store = { package = "burn-store", git = "https://github.com/tracel-ai/burn"}
dlib_sys = { package = "dlib", git = "https://github.com/a2va/dlib-rs", rev = "4e8c8c8", optional = true, features = ["embed-all"]}

thiserror = "1"
tuple-conv = "1.0.1"

[build-dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"]}
# burn-onnx = "0.21"
burn-onnx  = { git = "https://github.com/tracel-ai/burn-onnx" }

[dev-dependencies]
burn = { workspace = true, features = ["ndarray", "vision", "flex"]}

# [target.'cfg(target_arch = "wasm32")'.dependencies]
# burn = { version = "0.17", default-features = false } # Default features disabled for wasm target

[features]
# default = ["verify", "yunet", "centerface", "scrfd-10g", "scrfd-500m" , "dlib-detection", "deepid", "facenet512", "dlib-recognition"]
default = ["verify"]

verify = []

# Detection models
yunet = []
centerface = []
scrfd-10g = []
scrfd-500m = []
dlib-detection = ["dlib_sys", "dlib_sys/embed-fd-nn", "dlib_sys/embed-lp"]

# Recognition models
deepid = []
facenet512 = []
dlib-recognition = ["dlib_sys", "dlib_sys/embed-fe-nn"]

[profile.dev]
opt-level = 2

# Detection examples
[[example]]
name = "yunet"
required-features = ["yunet"]
[[example]]
name = "centerface"
required-features = ["centerface"]
[[example]]
name = "dlib-detection"
required-features = ["dlib-detection"]
[[example]]
name = "scrfd"
required-features = ["scrfd-10g", "scrfd-500m"]

# Recognition examples
[[example]]
name = "deepid"
required-features = ["verify", "deepid"]
[[example]]
name = "facenet"
required-features = ["verify", "facenet512"]
[[example]]
name = "dlib-recognition"
required-features = ["verify", "dlib-recognition"]
